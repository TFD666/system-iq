[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "systemiq"
version = "1.0.0"
requires-python = ">=3.10"
dependencies = [
    "httpx==0.28.1",
]

[tool.setuptools]
py-modules = ["systemiq", "redact", "hosted_client"]

[project.scripts]
systemiq = "systemiq:main"
